name: Macro Quant Verification Pipeline (Python & R)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python unit, time-series, and edge-case tests
        run: python -m pytest -v

      - name: Run Python macro & quant verification pipeline
        run: python -m src.run_all --refresh-cache

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("readr", "dplyr"), repos = "https://cloud.r-project.org")'

      - name: Run R econometric & robustness scripts
        run: |
          Rscript r_analytics/intangible_panel_models.R outputs/yearly_macro_gap_and_flows.csv outputs/r_models
          Rscript r_analytics/panel_fe_and_robustness.R outputs/yearly_macro_gap_and_flows.csv outputs/quant_scored_universe.csv outputs/r_models

      - name: Verify all generated artifacts exist
        run: |
          test -f outputs/verification_report.json
          test -f outputs/yearly_macro_gap_and_flows.csv
          test -f outputs/quant_scored_universe.csv
          test -f outputs/core_portfolio_weights.csv
          test -f outputs/r_models/flow_intangible_ols_summary.txt
          test -f outputs/r_models/robustness_flow_regime.txt
          test -f outputs/r_models/sharpe_factor_regression.txt

      - name: Upload verification artifacts (CSV, JSON, Charts, R Summaries)
        uses: actions/upload-artifact@v4
        with:
          name: quant-verification-outputs
          path: outputs/
